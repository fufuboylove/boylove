<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>香香腐宅 防走失頁｜最新可用網址・永久網域 boylove.cc</title>
<meta name="description" content="香香腐宅 官方防走失頁：永久網域 boylove.cc，以及中國大陸免翻牆即可訪問的最新線路。請收藏本頁，網址失效時回來查看最新可用網域。">
<meta name="keywords" content="香香腐宅, boylove.cc, 防走失, 最新網址, 備用網域, 線路">

<meta name="theme-color" content="#1d1626" media="(prefers-color-scheme: dark)">

<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg1:#fdf2f8; --bg2:#f3e8ff; --card:#ffffffcc; --card-solid:#fff;
  --text:#3b2a44; --muted:#8a7491; --border:#f0d6ea;
  --pink:#ec4899; --purple:#a855f7; --grad:linear-gradient(135deg,#f472b6 0%,#c084fc 100%);
  --ok:#16a34a; --ok-bg:#dcfce7; --bad:#dc2626; --bad-bg:#fee2e2; --wait:#a16207; --wait-bg:#fef3c7;
  --shadow:0 8px 28px rgba(190,90,170,.14);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg1:#1a1422; --bg2:#231a33; --card:#2a2038cc; --card-solid:#2a2038;
    --text:#f3e8ff; --muted:#b9a5c7; --border:#3d2f52;
    --ok:#4ade80; --ok-bg:#14532d66; --bad:#f87171; --bad-bg:#7f1d1d66; --wait:#fcd34d; --wait-bg:#78350f66;
    --shadow:0 8px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  background:radial-gradient(circle at 10% 0%,#fbcfe8aa 0,transparent 40%),radial-gradient(circle at 100% 30%,#ddd6feaa 0,transparent 40%),linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;line-height:1.6;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
@media (prefers-color-scheme: dark){
  body{background:radial-gradient(circle at 10% 0%,#831e5c55 0,transparent 40%),radial-gradient(circle at 100% 30%,#5b21b655 0,transparent 40%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 40px}
header{text-align:center;margin-bottom:22px}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:34px;font-weight:800;letter-spacing:.5px}
.brand .heart{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 16px rgba(236,72,153,.35)}
.brand .name{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{font-size:.55em;color:var(--text);font-weight:700;opacity:.85}
.subtitle{margin-top:6px;color:var(--muted);font-size:15px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 2px 12px;flex-wrap:wrap}
.section-title h2{font-size:18px;display:flex;align-items:center;gap:8px}
.section-title h2::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--grad)}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.perm{display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.perm::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--grad);opacity:.12}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.vpn{background:#fde68a55;color:#b45309;border:1px solid #fbbf2466}
.badge.cn{background:#c4b5fd44;color:#7c3aed;border:1px solid #a78bfa66}
@media (prefers-color-scheme: dark){.badge.vpn{color:#fcd34d}.badge.cn{color:#d8b4fe}}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.domain-card{display:flex;flex-direction:column;gap:12px;transition:transform .2s,border-color .2s,box-shadow .2s}
.domain-card.fastest{border-color:var(--pink);box-shadow:0 0 0 2px #f472b655,var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.domain{font-size:19px;font-weight:700;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.status{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.status.wait{background:var(--wait-bg);color:var(--wait)}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.fast-tag{font-size:12px;font-weight:800;color:#fff;background:var(--grad);padding:3px 10px;border-radius:999px}
.note{font-size:13.5px;color:var(--muted)}
.domain.line-name{font-family:inherit;font-size:20px}
.btns{display:flex;gap:8px;margin-top:auto}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:11px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .12s,opacity .2s,filter .2s;-webkit-tap-highlight-color:transparent;min-height:44px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;flex:1;box-shadow:0 6px 16px rgba(192,132,252,.35)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;color:var(--purple);border:1.5px solid #c084fc88}
.btn-ghost:hover{background:#c084fc1a}
@media (prefers-color-scheme: dark){.btn-ghost{color:#d8b4fe}}
.btn-sm{font-size:14px;padding:8px 14px;min-height:38px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.auto{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.auto .btn{width:100%;font-size:16px;padding:14px}
.auto small{text-align:center;color:var(--muted)}
.tips ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{display:flex;gap:8px;font-size:15px}
.tips li span:first-child{flex:none}
.contact{display:none}  /* 聯絡方式區塊：預設隱藏，填入後把 display 改為 block 或移除此行 */
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#3b2a44ee;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" aria-label="香香腐宅 防走失頁">
      <span class="heart" aria-hidden="true">♥</span>
      <span class="name">香香腐宅</span><span class="tag">防走失頁</span>
    </div>
    <p class="subtitle">網址失聯時，回來這裡找到最新線路</p>
  </header>

  <!-- 永久網域 -->
  <div class="section-title"><h2>永久網域</h2></div>
  <section class="card perm" id="permanent"></section>

  <!-- 大陸免翻牆線路 -->
  <div class="section-title">
    <h2>最新可用線路</h2>
    <div class="toolbar"><button class="btn btn-ghost btn-sm" id="recheck" type="button">↻ 重新檢測</button></div>
  </div>
  <p class="note" style="margin:-4px 2px 12px">以下網域在中國大陸<strong>免翻牆</strong>即可訪問，已依連線速度自動排序。</p>
  <section class="grid" id="mirrors"></section>

  <div class="auto">
    <button class="btn btn-primary" id="autoGo" type="button" disabled>⚡ 自動進入最快線路</button>
    <small id="autoHint">正在檢測線路速度…</small>
  </div>

  <!-- 溫馨提示 -->
  <div class="section-title"><h2>溫馨提示</h2></div>
  <section class="card tips">
    <ul>
      <li><span>📌</span><span>請<strong>收藏本頁</strong>，並記住永久網域 <strong>boylove.cc</strong>。</span></li>
      <li><span>🔁</span><span>若網址無法開啟，請嘗試其他線路。</span></li>
      <li><span>🌐</span><span>建議使用 Chrome、Safari 等瀏覽器訪問。</span></li>
    </ul>
  </section>

  <!--
    ===== 聯絡方式（預設隱藏）=====
    需要時請：
      1. 在下方 <ul> 中填入真實的聯絡連結（例如官方社群、客服信箱等）
      2. 刪除此 <section> 上的 class="contact"，或把 CSS 中 .contact{display:none} 改為 display:block
  -->
  <section class="contact" id="contact">
    <div class="section-title"><h2>聯絡我們</h2></div>
    <div class="card tips">
      <ul>
        <!-- <li><span>💬</span><a href="https://example.com" target="_blank" rel="noopener">官方頻道名稱</a></li> -->
      </ul>
    </div>
  </section>

  <footer>© <span id="year"></span> 香香腐宅 ・ 防走失頁</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
 *  網域設定（修改這裡即可）
 *  - PERMANENT：永久網域 { name: 顯示名稱, domain: 網域 }（需翻牆訪問；卡片只顯示 name）
 *  - MIRRORS：中國大陸免翻牆線路 { name: 顯示名稱, domain: 網域 }，可自由增刪
 *    （頁面會依實際檢測速度自動排序）
 * ========================================================= */
const PERMANENT = { name: "香香腐宅永久網域", domain: "boylove.cc" };
const PERMANENT_DOMAIN = PERMANENT.domain;
const MIRRORS = [
  // name：卡片上顯示的名稱（不顯示網域）；domain：實際網域
  { name: "線路1", domain: "fulovehouse.net" },
  { name: "線路2", domain: "fufulove.net" },
  { name: "線路3", domain: "fuzhaiboylove8.work" },
  { name: "線路4", domain: "fuzhaiboylove7.work" },
  // { name: "線路5", domain: "新網域.com" },   // ← 新增線路：照此格式加一行
];
const MIRROR_DOMAINS = MIRRORS.map(m => m.domain);
const labelOf = (d) => (MIRRORS.find(m => m.domain === d) || {}).name || d;
const PROBE_PATH = "/favicon.ico"; // 用於測速的路徑
const TIMEOUT_MS = 5000;           // 逾時（毫秒）
/* ========================================================= */

const $ = (s) => document.querySelector(s);
const results = {}; // domain -> ms | null(超時/失敗) | undefined(檢測中)
let round = 0;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800);
}

async function copyText(text, label){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy")}catch(_){}
    ta.remove();
  }
  toast("已複製" + (label ? "「" + label + "」網址" : "：" + text));
}

function cardHTML(domain, isPerm, label){
  const d=esc(domain);
  return `
    <div class="row">
      <div class="domain line-name">${esc(label)}</div>
      <div class="meta">
        ${isPerm ? '<span class="badge vpn">🔒 需翻牆</span>' : '<span class="badge cn">✓ 免翻牆</span>'}
        <span class="fast-tag" data-fast hidden>最快</span>
        <span class="status wait" data-status>檢測中…</span>
      </div>
    </div>
    ${isPerm ? '<p class="note">永久網域，需翻牆訪問。建議點擊「複製」保存網址。</p>' : ''}
    <div class="btns">
      <a class="btn btn-primary" href="https://${d}" target="_blank" rel="noopener">進入</a>
      <button class="btn btn-ghost" type="button" data-copy="${d}" data-label="${esc(label)}">複製</button>
    </div>`;
}

function render(){
  const p=$("#permanent"); p.dataset.domain=PERMANENT_DOMAIN; p.innerHTML=cardHTML(PERMANENT_DOMAIN,true,PERMANENT.name);
  const g=$("#mirrors"); g.innerHTML="";
  MIRRORS.forEach(m=>{
    const el=document.createElement("article");
    el.className="card domain-card"; el.dataset.domain=m.domain; el.innerHTML=cardHTML(m.domain,false,m.name);
    g.appendChild(el);
  });
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-copy]"); if(b) copyText("https://"+b.dataset.copy, b.dataset.label);
  });
}

/* 測速：以 fetch(no-cors) 為主，Image() 為備援；任一成功即視為可用 */
function probe(domain){
  const url="https://"+domain+PROBE_PATH+"?_t="+Date.now();
  const start=performance.now();
  return new Promise(resolve=>{
    let done=false;
    const finish=(ok)=>{ if(done) return; done=true; resolve(ok ? Math.round(performance.now()-start) : null); };
    const timer=setTimeout(()=>finish(false),TIMEOUT_MS);
    const clear=()=>clearTimeout(timer);
    let ctrl=null; try{ctrl=new AbortController()}catch(_){}
    if(window.fetch){
      fetch(url,{mode:"no-cors",cache:"no-store",signal:ctrl?ctrl.signal:undefined})
        .then(()=>{clear();finish(true)})
        .catch(()=>{ /* 失敗時交給 Image 或逾時判定 */ });
    }
    const img=new Image();
    img.onload=()=>{clear();finish(true)};
    // onerror 代表伺服器有回應（例如無 favicon），但 DNS 失敗也會觸發；交由 fetch 結果為主
    img.onerror=()=>{};
    img.src=url+"&img=1";
    setTimeout(()=>{ if(!done && ctrl) ctrl.abort(); },TIMEOUT_MS+50);
  });
}

function setStatus(el, ms){
  const s=el.querySelector("[data-status]");
  if(ms===undefined){ s.className="status wait"; s.textContent="檢測中…"; }
  else if(ms===null){ s.className="status bad"; s.textContent="超時"; }
  else { s.className="status ok"; s.textContent="可用 "+ms+" ms"; }
}

function updateRanking(){
  const g=$("#mirrors");
  const cards=[...g.children];
  cards.sort((a,b)=>{
    const x=results[a.dataset.domain], y=results[b.dataset.domain];
    const va=(typeof x==="number")?x:(x===null?1e9:1e8);
    const vb=(typeof y==="number")?y:(y===null?1e9:1e8);
    return va-vb;
  });
  cards.forEach(c=>g.appendChild(c));
  const ok=MIRROR_DOMAINS.filter(d=>typeof results[d]==="number").sort((a,b)=>results[a]-results[b]);
  const fastest=ok[0];
  cards.forEach(c=>{
    const f=c.dataset.domain===fastest;
    c.classList.toggle("fastest",f); c.querySelector("[data-fast]").hidden=!f;
  });
  return fastest;
}

async function runChecks(){
  const my=++round;
  const btn=$("#recheck"), auto=$("#autoGo"), hint=$("#autoHint");
  btn.disabled=true; auto.disabled=true; hint.textContent="正在檢測線路速度…";
  const all=[PERMANENT_DOMAIN,...MIRROR_DOMAINS];
  all.forEach(d=>{ results[d]=undefined; });
  document.querySelectorAll("[data-domain]").forEach(el=>setStatus(el,undefined));
  await Promise.all(all.map(async d=>{
    const ms=await probe(d);
    if(my!==round) return;
    results[d]=ms;
    const el=document.querySelector(`[data-domain="${CSS.escape(d)}"]`);
    if(el) setStatus(el,ms);
    if(d!==PERMANENT_DOMAIN) updateRanking();
  }));
  if(my!==round) return;
  const fastest=updateRanking();
  btn.disabled=false;
  if(fastest){ auto.disabled=false; auto.dataset.target=fastest; hint.textContent="最快線路："+labelOf(fastest)+"（"+results[fastest]+" ms）"; }
  else { hint.textContent="暫時無法檢測到可用線路，請直接點擊上方「進入」嘗試，或稍後重新檢測。"; }
}

$("#recheck").addEventListener("click",runChecks);
$("#autoGo").addEventListener("click",e=>{
  const t=e.currentTarget.dataset.target; if(t) window.open("https://"+t,"_blank","noopener");
});
$("#year").textContent=new Date().getFullYear();
render();
runChecks();
</script>
</body>
</html>
