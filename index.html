<style>

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{

body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;

.wrap{max-width:960px;margin:0 auto;padding:28px 16px 40px}

.domain-card.fastest{border-color:var(--pink);box-shadow:0 0 0 2px #f472b655,var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.domain{font-size:19px;font-weight:700;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

@media (prefers-color-scheme: dark){.btn-ghost{color:#d8b4fe}}
.btn-sm{font-size:14px;padding:8px 14px;min-height:38px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.auto{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.auto .btn{width:100%;font-size:16px;padding:14px}
.auto small{text-align:center;color:var(--muted)}
.tips ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{display:flex;gap:8px;font-size:15px}
.tips li span:first-child{flex:none}
.contact{display:none}  /* 联系方式区块：预设隐藏，填入后把 display 改为 block 或移除此行 */
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#3b2a44ee;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">

      <ul>
        <!-- <li><span>💬</span><a href="https://example.com" target="_blank" rel="noopener">官方频道名称</a></li> -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
 *  网域设定（修改这里即可）
 *  - PERMANENT：永久网域 { name: 显示名称, domain: 网域 }（需翻墙访问；卡片只显示 name）
 *  - MIRRORS：中国大陆免翻墙线路 { name: 显示名称, domain: 网域 }，可自由增删
 *    （页面会依实际检测速度自动排序）
 * ========================================================= */
const PERMANENT = { name: "香香腐宅永久网域", domain: "boylove.cc" };
const PERMANENT_DOMAIN = PERMANENT.domain;
const MIRRORS = [
  // name：卡片上显示的名称（不显示网域）；domain：实际网域
  { name: "线路1", domain: "fulovehouse.net" },
  { name: "线路2", domain: "fufulove.net" },
  { name: "线路3", domain: "fuzhaiboylove8.work" },
  { name: "线路4", domain: "fuzhaiboylove7.work" },
  // { name: "线路5", domain: "新网域.com" },   // ← 新增线路：照此格式加一行
];
const MIRROR_DOMAINS = MIRRORS.map(m => m.domain);
const labelOf = (d) => (MIRRORS.find(m => m.domain === d) || {}).name || d;
const PROBE_PATH = "/favicon.ico"; // 用于测速的路径
const TIMEOUT_MS = 5000;           // 逾时（毫秒）
/* ========================================================= */

const $ = (s) => document.querySelector(s);
const results = {}; // domain -> ms | null(超时/失败) | undefined(检测中)
let round = 0;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800);
}

async function copyText(text, label){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy")}catch(_){}
    ta.remove();
  }
  toast("已复制" + (label ? "“" + label + "”网址" : "：" + text));
}

function cardHTML(domain, isPerm, label){
  const d=esc(domain);
  return `
    <div class="row">
      <div class="domain line-name">${esc(label)}</div>
      <div class="meta">
        ${isPerm ? '<span class="badge vpn">🔒 需翻墙</span>' : '<span class="badge cn">✓ 免翻墙</span>'}
        <span class="fast-tag" data-fast hidden>最快</span>
        <span class="status wait" data-status>检测中…</span>
      </div>
    </div>
    ${isPerm ? '<p class="note">永久网域，需翻墙访问。建议点击“复制”保存网址。</p>' : ''}
    <div class="btns">
      <a class="btn btn-primary" href="https://${d}" target="_blank" rel="noopener">进入</a>
      <button class="btn btn-ghost" type="button" data-copy="${d}" data-label="${esc(label)}">复制</button>
    </div>`;
}

function render(){
  const p=$("#permanent"); p.dataset.domain=PERMANENT_DOMAIN; p.innerHTML=cardHTML(PERMANENT_DOMAIN,true,PERMANENT.name);
  const g=$("#mirrors"); g.innerHTML="";
  MIRRORS.forEach(m=>{
    const el=document.createElement("article");
    el.className="card domain-card"; el.dataset.domain=m.domain; el.innerHTML=cardHTML(m.domain,false,m.name);
    g.appendChild(el);
  });
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-copy]"); if(b) copyText("https://"+b.dataset.copy, b.dataset.label);
  });
}

/* 测速：以 fetch(no-cors) 为主，Image() 为备援；任一成功即视为可用 */
function probe(domain){
  const url="https://"+domain+PROBE_PATH+"?_t="+Date.now();
  const start=performance.now();
  return new Promise(resolve=>{
    let done=false;
    const finish=(ok)=>{ if(done) return; done=true; resolve(ok ? Math.round(performance.now()-start) : null); };
    const timer=setTimeout(()=>finish(false),TIMEOUT_MS);
    const clear=()=>clearTimeout(timer);
    let ctrl=null; try{ctrl=new AbortController()}catch(_){}
    if(window.fetch){
      fetch(url,{mode:"no-cors",cache:"no-store",signal:ctrl?ctrl.signal:undefined})
        .then(()=>{clear();finish(true)})
        .catch(()=>{ /* 失败时交给 Image 或逾时判定 */ });
    }
    const img=new Image();
    img.onload=()=>{clear();finish(true)};
    // onerror 代表伺服器有回应（例如无 favicon），但 DNS 失败也会触发；交由 fetch 结果为主
    img.onerror=()=>{};
    img.src=url+"&img=1";
    setTimeout(()=>{ if(!done && ctrl) ctrl.abort(); },TIMEOUT_MS+50);
  });
}

function setStatus(el, ms){
  const s=el.querySelector("[data-status]");
  if(ms===undefined){ s.className="status wait"; s.textContent="检测中…"; }
  else if(ms===null){ s.className="status bad"; s.textContent="超时"; }
  else { s.className="status ok"; s.textContent="可用 "+ms+" ms"; }
}

function updateRanking(){
  const g=$("#mirrors");
  const cards=[...g.children];
  cards.sort((a,b)=>{
    const x=results[a.dataset.domain], y=results[b.dataset.domain];
    const va=(typeof x==="number")?x:(x===null?1e9:1e8);
    const vb=(typeof y==="number")?y:(y===null?1e9:1e8);
    return va-vb;
  });
  cards.forEach(c=>g.appendChild(c));
  const ok=MIRROR_DOMAINS.filter(d=>typeof results[d]==="number").sort((a,b)=>results[a]-results[b]);
  const fastest=ok[0];
  cards.forEach(c=>{
    const f=c.dataset.domain===fastest;
    c.classList.toggle("fastest",f); c.querySelector("[data-fast]").hidden=!f;
  });
  return fastest;
}

async function runChecks(){
  const my=++round;
  const btn=$("#recheck"), auto=$("#autoGo"), hint=$("#autoHint");
  btn.disabled=true; auto.disabled=true; hint.textContent="正在检测线路速度…";
  const all=[PERMANENT_DOMAIN,...MIRROR_DOMAINS];
  all.forEach(d=>{ results[d]=undefined; });
  document.querySelectorAll("[data-domain]").forEach(el=>setStatus(el,undefined));
  await Promise.all(all.map(async d=>{
    const ms=await probe(d);
    if(my!==round) return;
    results[d]=ms;
    const el=document.querySelector(`[data-domain="${CSS.escape(d)}"]`);
    if(el) setStatus(el,ms);
    if(d!==PERMANENT_DOMAIN) updateRanking();
  }));
  if(my!==round) return;
  const fastest=updateRanking();
  btn.disabled=false;
  if(fastest){ auto.disabled=false; auto.dataset.target=fastest; hint.textContent="最快线路："+labelOf(fastest)+"（"+results[fastest]+" ms）"; }
  else { hint.textContent="暂时无法检测到可用线路，请直接点击上方“进入”尝试，或稍后重新检测。"; }
}

$("#recheck").addEventListener("click",runChecks);
$("#autoGo").addEventListener("click",e=>{
  const t=e.currentTarget.dataset.target; if(t) window.open("https://"+t,"_blank","noopener");
});
$("#year").textContent=new Date().getFullYear();
render();
runChecks();
</script>
</body>
